  - React production build 적용 및 JSX 사전 컴파일로 Babel 런타임 제거
  - 이미지 캡처 후 스타일 복원을 finally로 보장
  - 클립보드 실패 시 텍스트 복사 fallback 및 이미지 다운로드 fallback 적용

  - KakaoTalk CJ StatusBoard 이미지 저장/복사 시 흰색 배경 및 좌우 동일 여백 적용
  - KakaoTale 캠페인 API 집계 이미지 캡처 개선
  - 캡처 대상별 처리 분리
  그 외 기능 로직과 화면 구성은 원본 v1.4.4를 유지하는 것을 우선으로 함
