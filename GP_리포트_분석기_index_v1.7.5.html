<script>

            ? (parseFloat(computedStyle.paddingLeft) || 0)

            ? elementRect.width
            : Math.max(el.scrollWidth, elementRect.width);
        const totalW = Math.ceil(baseWidth + extraRightPadding);
        const totalH = Math.ceil(Math.max(el.scrollHeight, elementRect.height));
        const currentViewportW = Math.ceil(window.innerWidth || document.documentElement.clientWidth || totalW);
        const currentViewportH = Math.ceil(window.innerHeight || document.documentElement.clientHeight || totalH);

            scale: 2,
            useCORS: true,
            logging: false,
            backgroundColor: captureBackground,
            width: totalW,
            height: totalH,
            // 캡처 너비를 viewport 너비로 사용하면 상위 반응형 레이아웃이 축소되어

        overflowState.forEach((state, node) => {
            node.style.overflow = state.overflow;
            node.style.overflowX = state.overflowX;
            node.style.overflowY = state.overflowY;

}
function downloadCanvas(canvas, filename) {

}

}
